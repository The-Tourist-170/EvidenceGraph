services:
  valkey:
    image: valkey/valkey:8-alpine
    command:
      [
        "valkey-server",
        "--requirepass",
        "${VALKEY_PASSWORD:-local-dev-password}",
        "--appendonly",
        "yes",
      ]
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:-local-dev-password}
    ports:
      - "6380:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'valkey-cli --no-auth-warning -a "$${VALKEY_PASSWORD}" ping',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-evidencegraph}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-password}
      POSTGRES_DB: ${POSTGRES_DB:-evidencegraph}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.13.4
    ports:
      - "6335:6333"
      - "6336:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/local-dev-password}
    ports:
      - "7475:7474"
      - "7688:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -u neo4j -p $${NEO4J_PASSWORD:-local-dev-password} 'RETURN 1' || exit 1",
        ]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s

  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-evidencegraph}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-local-dev-password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  research-worker:
    build: .
    profiles: ["workers"]
    command: ["bun", "--cwd", "apps/workers", "start:research"]
    restart: unless-stopped
    stop_grace_period: 6m
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: development
      VALKEY_URL: redis://valkey:6379
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:-local-dev-password}
      RESEARCH_WORKER_CONCURRENCY: ${RESEARCH_WORKER_CONCURRENCY:-4}
      WORKER_LOCK_DURATION_MS: ${WORKER_LOCK_DURATION_MS:-30000}
      WORKER_STALLED_INTERVAL_MS: ${WORKER_STALLED_INTERVAL_MS:-30000}
      WORKER_CANCEL_POLL_INTERVAL_MS: ${WORKER_CANCEL_POLL_INTERVAL_MS:-100}
      WORKER_SHUTDOWN_TIMEOUT_MS: ${WORKER_SHUTDOWN_TIMEOUT_MS:-30000}
      SIMULATED_STAGE_DELAY_MS: ${SIMULATED_STAGE_DELAY_MS:-150}
    depends_on:
      valkey:
        condition: service_healthy

  document-worker:
    build: .
    profiles: ["workers"]
    command: ["bun", "--cwd", "apps/workers", "start:documents"]
    restart: unless-stopped
    stop_grace_period: 6m
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: development
      VALKEY_URL: redis://valkey:6379
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:-local-dev-password}
      DATABASE_URL: postgres://${POSTGRES_USER:-evidencegraph}:${POSTGRES_PASSWORD:-local-dev-password}@postgres:5432/${POSTGRES_DB:-evidencegraph}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-evidencegraph}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-local-dev-password}
      MINIO_BUCKET: ${MINIO_BUCKET:-evidencegraph-documents}
      QDRANT_URL: http://qdrant:6333
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/local-dev-password}
      DOCUMENT_WORKER_CONCURRENCY: ${DOCUMENT_WORKER_CONCURRENCY:-2}
      DOCUMENT_WORKER_TIMEOUT_SECONDS: ${DOCUMENT_WORKER_TIMEOUT_SECONDS:-300}
      WORKER_LOCK_DURATION_MS: ${WORKER_LOCK_DURATION_MS:-30000}
      WORKER_STALLED_INTERVAL_MS: ${WORKER_STALLED_INTERVAL_MS:-30000}
      WORKER_CANCEL_POLL_INTERVAL_MS: ${WORKER_CANCEL_POLL_INTERVAL_MS:-100}
      WORKER_SHUTDOWN_TIMEOUT_MS: ${WORKER_SHUTDOWN_TIMEOUT_MS:-30000}
      SIMULATED_STAGE_DELAY_MS: ${SIMULATED_STAGE_DELAY_MS:-150}
    depends_on:
      valkey:
        condition: service_healthy
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_healthy

volumes:
  valkey-data:
  postgres-data:
  qdrant-data:
  neo4j-data:
  minio-data:
