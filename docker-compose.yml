services:
  valkey:
    image: valkey/valkey:8-alpine
    command:
      [
        "valkey-server",
        "--requirepass",
        "${VALKEY_PASSWORD:-local-dev-password}",
        "--appendonly",
        "yes",
      ]
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:-local-dev-password}
    ports:
      - "6380:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'valkey-cli --no-auth-warning -a "$${VALKEY_PASSWORD}" ping',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-evidencegraph}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-password}
      POSTGRES_DB: ${POSTGRES_DB:-evidencegraph}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.13.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/local-dev-password}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -u neo4j -p $${NEO4J_PASSWORD:-local-dev-password} 'RETURN 1' || exit 1",
        ]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s

  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-evidencegraph}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-local-dev-password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  valkey-data:
  postgres-data:
  qdrant-data:
  neo4j-data:
  minio-data:
